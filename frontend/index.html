<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/yousual-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Open Graph tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yousual" />
    <meta property="og:title" content="Yousual - Keep your business on record." />
    <meta property="og:description" content="Record every sale, expense, track payment, send receipts in one place, and always know where your business stands." />
    <meta property="og:url" content="https://yousual.ng/" />
    <meta property="og:image" content="/images/yousual-og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yousual — record sales and send receipts for your business" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter/X card (WhatsApp ignores these, but worth having) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yousual - Keep your business on record." />
    <meta name="twitter:description" content="Record every sale, expense, track payment, send receipts in one place, and always know where your business stands." />
    <meta name="twitter:image" content="https://noqbook.onrender.com/images/yousual-og-image.png" />

    <!-- Standard SEO description (separate from og:description, but keep them aligned) -->
    <meta name="description" content="Record every sale, expense, track payment, send receipts in one place, and always know where your business stands." />

    <!-- Canonical + title tag -->
    <title>Yousual - Keep your business on record.</title>
    <link rel="canonical" href="https://yousual.ng/" />

    <title>Yousual - Keep your business on record.</title>
    <meta
      name="description"
      content="Log every sale in seconds, share the receipt on WhatsApp, and always know what came in, what went out, and who still owes you."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
